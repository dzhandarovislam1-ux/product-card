<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4ed" />
    <title>Пользователи | Async</title>
    <link rel="stylesheet" href="./async.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <p class="eyebrow">Асинхронная загрузка</p>
        <h1>Пользователи</h1>
      </header>

      <section class="toolbar" aria-label="Управление пользователями">
        <button class="button button--primary" id="show-all" type="button">
          Получить всех
        </button>
        <button class="button button--danger" id="delete-all" type="button">
          Удалить всех
        </button>
      </section>

      <p class="status" id="status" role="status" aria-live="polite">
        Данные загружаются
      </p>
      <section
        class="users"
        id="users"
        aria-label="Список пользователей"
      ></section>
    </main>

    <script type="module" src="./async.js"></script>
  </body>
</html>
